name: Build Pirate Radio W92LF v4 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unpack W92LF v4 source
        run: base64 -d pirate-w92lf-v4-src.tar.gz.b64 | tar -xz
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify UI, links and actual MP3 audio
        run: python3 scripts/check_release.py
      - name: Compile Android APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Check APK integrity and signing
        shell: bash
        run: |
          set -e
          python3 scripts/check_release.py --offline
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
      - uses: actions/upload-artifact@v4
        with:
          name: PirateRadioW92LF-v4-Verified-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Pirate Radio W92LF v4.2 and run QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verified-android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unpack W92LF Android source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d pirate-w92lf-v4-2-src.tar.gz.b64 | tar -xz
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify interface and public MP3 responses
        run: python3 scripts/check_release.py
      - name: Run archive and MP3 unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile Android APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK structure and signature
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_release.py --offline
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pixel emulator archive navigation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          script: bash qa_emulator_debug.sh
      - name: Publish tested APK
        uses: actions/upload-artifact@v4
        with:
          name: PirateRadioW92LF-v4.2-Tested-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Probe public archive audio
on:
  push:
    paths:
      - .github/workflows/probe-archive.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe public Internet Archive recordings
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          queries=[
            '(title:"pirate radio" OR subject:"pirate radio") AND mediatype:audio',
            '(title:"jungle" AND title:"radio") AND mediatype:audio',
            '(title:"rave" AND title:"tape") AND mediatype:audio'
          ]
          for q in queries:
            print("QUERY",q,flush=True)
            url='https://archive.org/advancedsearch.php?'+urllib.parse.urlencode({'q':q,'fl[]':['identifier','title','creator'],'rows':10,'output':'json'},doseq=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'PirateRadioW92LF/1.0 (archive exploration)'})
              with urllib.request.urlopen(req,timeout=25) as r: d=json.load(r)
              print('numFound', d['response']['numFound'])
              for item in d['response']['docs'][:6]:
                ident=item['identifier']
                print('ITEM', ident, item.get('title','')[:100],flush=True)
                try:
                  with urllib.request.urlopen('https://archive.org/metadata/'+urllib.parse.quote(ident),timeout=14) as r: md=json.load(r)
                  mp3s=[f.get('name','') for f in md.get('files',[]) if f.get('name','').lower().endswith('.mp3') and f.get('source') in ('original','derivative')]
                  print('MP3_FILES', mp3s[:2],flush=True)
                  if mp3s:
                    u='https://archive.org/download/'+urllib.parse.quote(ident)+'/'+urllib.parse.quote(mp3s[0])
                    req=urllib.request.Request(u,headers={'Range':'bytes=0-63','User-Agent':'PirateRadioW92LF/1.0'})
                    try:
                      with urllib.request.urlopen(req,timeout=20) as rr:
                        print('PLAY_URL',u,'STATUS',rr.status,'TYPE',rr.headers.get('Content-Type'),'BYTES',rr.read(16).hex(),flush=True)
                    except Exception as e:
                      print('PLAY_ERR',type(e).__name__,str(e)[:90],flush=True)
                except Exception as e: print('META_ERR',type(e).__name__,str(e)[:90],flush=True)
            except Exception as e: print('SEARCH_ERR',type(e).__name__,str(e)[:140],flush=True)
          PY
